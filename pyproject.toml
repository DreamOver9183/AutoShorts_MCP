[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshorts-mcp"
version = "0.2.0"
description = "AI 驅動短影音自動化剪輯系統，基於 Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11,<3.13"          # §3.3：上限受 numba 支援進度限制
license = { text = "UNLICENSED" }          # 附錄 A-1 待決議
authors = [{ name = "DreamOver9183" }]

dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "psutil>=5.9.0",
    "librosa>=0.10.2",
    "scenedetect>=0.6.4",
    "yt-dlp>=2024.8.6",
    "typer>=0.12.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
# §2.3.2 LLM Provider 以 extras 提供，核心不強制相依任何供應商 SDK
gemini = ["google-genai>=1.0.0"]
claude = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
local  = ["openai>=1.50.0"]
dev    = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
autoshorts = "autoshorts_mcp.cli:app"
autoshorts-mcp = "autoshorts_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: 需要 FFmpeg 執行檔",
    "slow: 執行時間較長（4K 素材或大量重抽）",
]
